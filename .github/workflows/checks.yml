name: Software checks (no hardware)
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compute and test dependencies
        run: >-
          python -m pip install -c requirements/constraints.txt pytest
          -e packages/openarm_mujoco -e packages/openarm_control
          -e nodes/dora-openarm-kinematics
          -e nodes/dora-openarm-stereo-camera
          -e nodes/dora-openarm-webxr
          -e nodes/dora-openarm-dataset-recorder
      - name: Fault injection and regression tests
        run: >-
          python -m pytest -q tests packages/openarm_control/tests
          nodes/dora-openarm-stereo-camera/tests
          nodes/dora-openarm-webxr/tests
          nodes/dora-openarm-dataset-recorder/tests
      - name: Local IK benchmark
        run: python scripts/preflight.py
      - name: Verify project layout
        run: python scripts/check_layout.py
      - name: Verify source manifest
        run: python scripts/update_manifest.py --check
