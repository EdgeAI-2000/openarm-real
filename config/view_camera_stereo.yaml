# OpenArm 2.0 head-mounted stereo camera view for Quest 3.
# Regenerate the optical values from the attached ZED calibration before
# production use; see README.md. The defaults are for 1280x720 per eye.
view: stereo

session:
  mode: immersive-vr

camera:
  horizontal_fov: 79.4
  vertical_fov: 50.1

panel:
  lock: head
  distance: 1.3

# Monocular gripper-camera views, rendered identically in both eyes as
# head-locked picture-in-picture panels. Positions are in the headset frame:
# left/right panels use +/- horizontal_offset and share vertical_offset.
wrist_panels:
  enabled: true
  distance: 1.0
  width: 0.38
  horizontal_offset: 0.36
  vertical_offset: -0.27

stereo:
  vertical_align: 10.0
  convergence: -1.7

pose:
  frame_offset: [-0.1, 0.0, 0.23]
  neck_pivot_offset: [0.0, -0.075, 0.080]
